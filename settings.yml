```yaml
use_default_settings: true

general:
  debug: false
  instance_name: "Shiraali Search"

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

server:
  secret_key: "ultrasecretkey"
  limiter: false
  public_instance: false
  image_proxy: true
  default_http_headers:
    Access-Control-Allow-Origin: "https://shiraali.ir"
    Vary: "Origin"
    X-Content-Type-Options: "nosniff"
    X-Download-Options: "noopen"
    X-Robots-Tag: "noindex, nofollow"
    Referrer-Policy: "no-referrer"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 8.0
  pool_connections: 100
  enable_http2: true

engines:
  - name: bing
    disabled: false

  - name: yandex
    disabled: false

  - name: google
    disabled: false

  - name: duckduckgo
    disabled: false

  - name: brave
    disabled: false

  - name: startpage
    disabled: false

  - name: ecosia
    disabled: false

  - name: dogpile
    disabled: false
```
