outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0

engines:
  - name: bing
    disabled: false
  - name: yandex
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: google
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: ecosia
    engine: xpath
    disabled: false
    shortcut: eco
    categories: [general]
    timeout: 10.0
    search_url: https://www.ecosia.org/search?q={query}
    results_xpath: //div[@class="result"]
    title_xpath: .//a[@class="result-title"]
    url_xpath: .//a[@class="result-title"]/@href
    content_xpath: .//p
  - name: dogpile
    disabled: false
