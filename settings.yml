use_default_settings: true

general:
  debug: false
  instance_name: "Shiraali Search"
  enable_metrics: false
  formats:
    - html
    - json

server:
  secret_key: "REPLACE_WITH_RANDOM_SECRET"
  limiter: false
  public_instance: false
  default_http_headers:
    Access-Control-Allow-Origin: "https://shiraali.ir"
